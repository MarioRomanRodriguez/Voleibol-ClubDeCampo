<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Delegación Voleibol Club de Campo</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#15202b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Delegación Voley">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --bg:#f3f4ef; --card:#ffffff; --ink:#15202b; --muted:#667280; --line:#d8dcd3; --field:#ffffff;
  --a:#0a86c2; --a-soft:#dff1fb; --b:#d4650a; --b-soft:#fdebd9;
  --net:#15202b; --red:#c62828;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10161d; --card:#1a232d; --ink:#eef1f4; --muted:#93a0ad; --line:#2c3844; --field:#10161d;
    --a:#4cb8ee; --a-soft:#0f3347; --b:#f39a45; --b-soft:#4a2d14; --net:#eef1f4; --red:#ef6b6b;
  }
}
:root[data-theme="dark"]{
  --bg:#10161d; --card:#1a232d; --ink:#eef1f4; --muted:#93a0ad; --line:#2c3844; --field:#10161d;
  --a:#4cb8ee; --a-soft:#0f3347; --b:#f39a45; --b-soft:#4a2d14; --net:#eef1f4; --red:#ef6b6b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Avenir Next","Segoe UI",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:520px;margin:0 auto;padding:10px 10px 90px}
h1{font-size:1.5rem;margin:14px 4px 4px;letter-spacing:-.3px}
p.sub{margin:0 4px 14px;color:var(--muted);font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:1.1rem}
label.f{display:block;font-size:.85rem;color:var(--muted);margin:10px 0 4px}
label.f:first-child{margin-top:0}
.txt,select,textarea{width:100%;padding:11px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--field);font-size:1rem}
.txt:focus,select:focus,textarea:focus{outline:3px solid var(--ink);outline-offset:1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:10px;padding:14px 12px;font-weight:700;background:var(--ink);color:var(--bg);cursor:pointer;width:100%}
.btn.sec{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.warn{background:var(--red);color:#fff}
.btn:disabled{opacity:.35;cursor:default}
.btn+.btn{margin-top:8px}
.btn:focus-visible,.cell:focus-visible,.seg button:focus-visible,.tg:focus-visible,.pickb:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:12px 8px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-weight:700;cursor:pointer}
.seg button.on.ta{background:var(--a);border-color:var(--a);color:#fff}
.seg button.on.tb{background:var(--b);border-color:var(--b);color:#fff}
.seg button.on.neutral{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.err{color:var(--b);font-size:.9rem;margin:6px 2px;min-height:1.2em}
.hint{font-size:.85rem;color:var(--muted);margin:8px 2px}

.t0{--c:var(--a);--soft:var(--a-soft)}
.t1{--c:var(--b);--soft:var(--b-soft)}

/* partido */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 2px 10px}
.top .setno{font-weight:800;font-size:1.05rem}
.top .sets{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem;text-align:right}
.prev{font-size:.85rem;color:var(--muted);margin:0 2px 8px;font-variant-numeric:tabular-nums}
.notice{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 12px;margin-bottom:10px;font-weight:600}
.notice button{background:var(--bg);color:var(--ink);border:0;border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer;flex:none}

.teams{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.team{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;border-top:6px solid var(--c)}
.team.serving{background:var(--soft)}
.tname{font-weight:700;font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tscore{font-size:4.2rem;line-height:1;font-weight:900;font-variant-numeric:tabular-nums;margin:6px 0 8px;color:var(--c)}
.tscore.bump{animation:bump .15s}
@keyframes bump{50%{transform:scale(1.1)}}
@media (prefers-reduced-motion: reduce){.tscore.bump{animation:none}}
.court{margin-bottom:8px}
.net{height:5px;background:var(--net);border-radius:3px;margin-bottom:4px;opacity:.85}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.cell{position:relative;aspect-ratio:1;border-radius:8px;border:1.5px solid var(--line);background:var(--card);
  display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:0;min-width:0}
.cell b{font-size:1.3rem;line-height:1.05;font-weight:800;font-variant-numeric:tabular-nums}
.cell em{font-style:normal;font-size:.56rem;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.cell .pos{position:absolute;top:2px;left:4px;font-size:.58rem;font-weight:600;color:var(--muted)}
.cell .cap{position:absolute;top:2px;right:4px;font-size:.58rem;font-weight:800;color:var(--muted)}
.cell .ball{position:absolute;bottom:0;right:2px;font-size:.8rem}
.cell.srv{border-color:var(--c);border-width:3px}
.cell.lib{border-style:dashed;border-color:var(--ink)}
.cell.gone{border-color:var(--red);border-width:3px;opacity:.6}
.cell:disabled{cursor:default}
.cell.lusel{border-color:var(--c);border-width:3px;background:var(--soft)}
.pickb.used{opacity:.6}
.pickb.here{border-color:var(--ink);box-shadow:0 0 0 2px var(--a-soft)}
.pickb small{font-size:.62rem;color:var(--muted)}
.pt{background:var(--c);color:#fff;font-size:1.1rem;padding:16px 8px}
.tm{margin-top:6px;font-size:.85rem;padding:10px 6px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);z-index:20}
.bar .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.bar .btn{padding:12px 2px;font-size:.82rem}
.bar .btn+.btn{margin-top:0}

/* plantillas */
.rrow{display:grid;grid-template-columns:52px 1fr 36px 36px 44px;gap:6px;margin-bottom:6px;align-items:center}
.rrow .txt{padding:9px 8px}
.rn{text-align:center;font-weight:700}
.tg{height:38px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);font-weight:800;cursor:pointer}
.tg.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tg.xx{border:0;background:transparent;color:var(--muted);font-size:1.3rem}
.thd{font-weight:800;color:var(--c);margin:0 0 8px;font-size:1.05rem}
.card.tc{border-top:6px solid var(--c)}
.legend2{font-size:.8rem;color:var(--muted);margin:0 0 8px}

/* alineaciones */
.lu{padding:10px}
.lsel{display:block;position:relative}
.lsel span{position:absolute;top:2px;left:5px;font-size:.58rem;font-weight:600;color:var(--muted);pointer-events:none;z-index:1}
.lsel select{padding:14px 2px 6px 4px;font-size:.8rem;border-radius:8px}

.big{font-size:2.6rem;font-weight:900;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
.win{font-weight:800}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 4px}
.sheet .sub0{margin:0 0 10px;color:var(--muted)}
.sec-t{font-weight:700;margin:12px 0 6px}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pickb{border:1.5px solid var(--line);background:var(--field);border-radius:10px;padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;min-width:0}
.pickb b{font-size:1.4rem;line-height:1}
.pickb em{font-style:normal;font-size:.72rem;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.log{list-style:none;margin:0;padding:0}
.log li{padding:7px 0;border-bottom:1px solid var(--line);font-size:.9rem;display:flex;gap:8px}
.log li b{min-width:54px;flex:none;font-variant-numeric:tabular-nums}
.log li.sh{font-weight:800;border:0;padding-top:12px}
textarea{min-height:90px;resize:vertical}
.tmbox{position:fixed;left:10px;right:10px;top:calc(8px + env(safe-area-inset-top,0px));max-width:500px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;z-index:60}
.tmbox b{font-size:2rem;font-variant-numeric:tabular-nums}
.tmbox button{background:transparent;border:1.5px solid currentColor;border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:70;max-width:90%;text-align:center}
#toast.show{opacity:1}

.logo{width:116px;height:116px;display:block;margin:6px auto 4px;border-radius:50%}
.verwrap{position:relative;height:0}
.ver{position:absolute;right:2px;top:2px;font-size:.78rem;font-weight:800;color:var(--muted);border:1.5px solid var(--line);border-radius:999px;padding:2px 10px;background:var(--card)}
.homehead{text-align:center;margin:8px 0 14px}
.homehead h1{margin:6px 0 2px}.homehead .sub{margin:0}
.card.tight{padding:8px}
.stand{font-size:.9rem}.stand th,.stand td{padding:7px 3px}
.stand th:nth-child(2),.stand td.tn2{text-align:left}
.stand td.tn2{font-weight:600}.stand td.pts{font-weight:900}
.stand tr.pod.p1{--pc:rgba(240,185,11,.26);--pa:#e5ac00}
.stand tr.pod.p2{--pc:rgba(160,170,182,.26);--pa:#9aa3ad}
.stand tr.pod.p3{--pc:rgba(205,127,50,.24);--pa:#c27a38}
.stand tr.pod{background:linear-gradient(90deg,var(--pc),transparent 88%)}
.stand tr.pod td:first-child{box-shadow:inset 4px 0 0 var(--pa)}
.stand tr.pod td.tn2{font-weight:800}
.stand tr.pod td:first-child{font-weight:900;color:var(--pa);padding-left:10px}
.medal{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-weight:900;font-size:.85rem;border:1.5px solid rgba(0,0,0,.18);box-shadow:0 1px 3px rgba(0,0,0,.35),inset 0 1px 1px rgba(255,255,255,.75)}
.medal.m1{background:radial-gradient(circle at 30% 25%,#fff7b8,#f5c518 55%,#c48a05);color:#3b2a00}
.medal.m2{background:radial-gradient(circle at 30% 25%,#ffffff,#d6dbe1 55%,#97a0aa);color:#27303a}
.medal.m3{background:radial-gradient(circle at 30% 25%,#ffdcb4,#d98c4a 55%,#99581f);color:#3a1d05}
.res .spb{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.res .spb button{padding:9px 13px;font-size:.88rem;border-radius:10px}
.res li small.md{font-weight:700;color:var(--a);margin-top:1px}
.res li small.susptxt{color:#b35c00;font-weight:700}
.btn.susp{margin-top:8px}
label.chk{display:flex;gap:8px;align-items:flex-start;margin:12px 0;font-size:.92rem}
label.chk input{width:22px;height:22px;flex:none;margin-top:1px}
.res{list-style:none;margin:0;padding:0}
.res li{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.res li .m{flex:1;min-width:0}.res li small{display:block;color:var(--muted);font-size:.76rem;margin-top:2px}
.res button{border:1.5px solid var(--line);background:transparent;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:.8rem}
.pname{font-weight:600;padding:0 4px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.92rem}
.ptrow{display:flex;gap:6px}
.ptrow .pt{flex:1;width:auto;min-width:0}
.ptrow .minus{width:54px;flex:none;padding:0;font-size:1.2rem;font-weight:800}
.ptrow .btn+.btn{margin-top:0}
.jor{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:10px;cursor:pointer;font:inherit}
.jor b{font-size:1.05rem}.jor span{color:var(--muted);font-size:.85rem;grid-column:1}.jor em{grid-row:1/3;grid-column:2;align-self:center;font-style:normal;font-weight:700;font-size:.85rem}
.jor.next{border-color:var(--a);box-shadow:0 0 0 2px var(--a-soft)}
.sync{font-size:.78rem;color:var(--muted);margin:4px 2px 12px}
.res button.go{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.res .hr{font-weight:800;min-width:46px;color:var(--muted);font-size:.85rem}
h3.grp{margin:16px 4px 8px;font-size:1rem}
.btn.upd{background:var(--a);color:#fff;font-size:1.05rem;padding:16px 12px;margin:6px 0 14px;box-shadow:0 3px 0 rgba(0,0,0,.18);letter-spacing:.2px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.upd{color:#04202e}}
:root[data-theme="dark"] .btn.upd{color:#04202e}
.savebox{border:2px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.savebox.ok{border-color:#2e9e5b;background:rgba(46,158,91,.12)}
.savebox.wait{border-color:var(--b);background:var(--b-soft)}
.savebox p{margin:6px 0 10px;font-size:.88rem;color:var(--muted)}
.savebox .btn{margin-top:10px}
.welcome{text-align:center}.welcome .tick{width:84px;height:84px;border-radius:50%;background:#2e9e5b;color:#fff;font-size:3rem;font-weight:900;display:flex;align-items:center;justify-content:center;margin:6px auto 10px}
.welcome h3{font-size:1.35rem}
.ssum{margin:0 2px 8px;font-size:.88rem}.srow{display:flex;gap:10px;padding:3px 0;border-bottom:1px solid var(--line)}.srow .sl{font-weight:800;min-width:46px}.srow .sv{flex:1;min-width:0;font-variant-numeric:tabular-nums}.srow.cur .sv{color:var(--muted);font-style:italic}
.tg.bj{font-size:.68rem;font-weight:700;color:var(--muted)}
.lnk{border:0;background:none;color:var(--a);font:inherit;font-weight:700;cursor:pointer;padding:0 0 0 6px}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>
<div id="toast" role="status"></div>

  function benchFor(t, c){

  /* ---------- calendario editable (organización) ---------- */
  function okISO(x){ return typeof x === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(x) && !isNaN(new Date(x + 'T00:00:00Z').getTime()); }
  function okHM(x){ return typeof x === 'string' && /^([01]\d|2[0-3]):[0-5]\d$/.test(x); }
  function addDays(iso, n){ var d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
  function diffDays(a, b){ return Math.round((new Date(b + 'T00:00:00Z').getTime() - new Date(a + 'T00:00:00Z').getTime()) / 86400000); }
  function cleanSched(x){
    function part(y){
      var r = {jd:{}, mt:{}, md:{}};
      if (y && typeof y === 'object'){
        Object.keys(y.jd || {}).forEach(function(k){ if (/^(\d{1,2}|R)$/.test(k) && okISO(y.jd[k])) r.jd[k] = y.jd[k]; });
        Object.keys(y.mt || {}).forEach(function(k){ if (/^j(\d{1,2}|R)-\d{1,2}$/.test(k) && okHM(y.mt[k])) r.mt[k] = y.mt[k]; });
        Object.keys(y.md || {}).forEach(function(k){ if (/^j(\d{1,2}|R)-\d{1,2}$/.test(k) && okISO(y.md[k])) r.md[k] = y.md[k]; });
      }
      return r;
    }
    var o = part(x); o.u = (x && Array.isArray(x.u)) ? x.u.slice(-15).map(part) : [];
    return o;
  }
  function applySched(){
    var s = cleanSched(G.sched);
    CALENDAR.forEach(function(J, i){
      var o = CAL0[i], key = String(o.n);
      J.d = s.jd[key] || o.d;
      J.m = o.m.map(function(m, k){
        var id = 'j' + key + '-' + (k + 1), row = [s.mt[id] || m[0], m[1], m[2]];
        if (s.md[id]) row[3] = s.md[id];
        return row;
      });
    });
  }
  function finishSched(){
    G.sched = cleanSched(G.sched); applySched(); saveG();
    enqueue({op:'sched', id:'sched', sched:G.sched});
    render();
  }
  function schedCommit(mut){
    var s = G.sched = cleanSched(G.sched);
    var snap = {jd:JSON.parse(JSON.stringify(s.jd)), mt:JSON.parse(JSON.stringify(s.mt)), md:JSON.parse(JSON.stringify(s.md))};
    mut(s);
    s.u = s.u.concat([snap]).slice(-15);
    finishSched();
  }
  // Cambia la fecha de la jornada n sumando delta días; con cascade también mueve todas las siguientes
  function shiftFrom(n, delta, cascade){
    var idx = -1;
    CALENDAR.forEach(function(J, i){ if (String(J.n) === String(n)) idx = i; });
    if (idx < 0 || !delta) return;
    schedCommit(function(s){
      CALENDAR.forEach(function(J, i){
        if (cascade ? i < idx : i !== idx) return;
        var key = String(J.n);
        s.jd[key] = addDays(J.d, delta);
        J.m.forEach(function(m, k){ var id = 'j' + key + '-' + (k + 1); if (s.md[id]) s.md[id] = addDays(s.md[id], delta); });
      });
    });
  }
  function setMatchTime(id, hm, iso){
    schedCommit(function(s){
      if (okHM(hm)) s.mt[id] = hm; else delete s.mt[id];
      if (okISO(iso)) s.md[id] = iso; else delete s.md[id];
    });
  }

      (S.roster[t] || []).forEach(function(p){

        if (row){ row.n = p.n; row.cap = !!p.cap; row.lib = !!p.lib; }

  function decodeCode(txt){
    var m = String(txt || '').match(/ACTA-LIGA:([A-Za-z0-9+\/=]+)/); if (!m) return null;
    var arr;
    try { arr = JSON.parse(decodeURIComponent(escape(atob(m[1])))); } catch(e){ return null; }
    if (!Array.isArray(arr)) return null;
    var out = [];
    arr.forEach(function(r){
      if (!r || typeof r.id !== 'string' || r.id.length > 40) return;
      if (!teamData(r.a) || !teamData(r.b) || r.a === r.b) return;
      if (r.bo !== 3 && r.bo !== 5) return;
      if (!Array.isArray(r.sets) || r.sets.length < 2 || r.sets.length > 5) return;
      var ok = true;
      var sets = r.sets.map(function(s){
        if (!Array.isArray(s) || s.length !== 2){ ok = false; return [0,0]; }
        var x = parseInt(s[0], 10), y = parseInt(s[1], 10);
        if (!(x >= 0 && x <= 99 && y >= 0 && y <= 99)){ ok = false; }
        return [x, y];
      });
      if (!ok) return;
      out.push({id:r.id, d:/^\d{4}-\d{2}-\d{2}$/.test(r.d) ? r.d : '', a:r.a, b:r.b, sets:sets, bo:r.bo, np:(r.np === 'a' || r.np === 'b') ? r.np : '', j:String(r.j || '').slice(0, 12), jor:String(r.jor || '').slice(0, 20)});

  }

      case 'swap': push(); S.swap = !S.swap; ev(null, 'cc', 'Cambio de campo manual'); commit(); break;
      case 'log': ui.modal = {type:'log'}; render(); break;
      case 'pdf': exportPDF(); break;
      case 'mailpdf': sendMail(true); break;
      case 'mailtxt': sendMail(false); break;
      case 'np': ui.modal = {type:'np', abs:'', pre:'', jor:''}; render(); break;
      case 'npDo': {
        var m2 = ui.modal; m2.jor = $('npJor').value.trim();
        if (!m2.abs || !m2.pre){ $('merr').textContent = 'Elige los dos equipos.'; break; }
        if (m2.abs === m2.pre){ $('merr').textContent = 'Los dos equipos no pueden ser el mismo.'; break; }
        var a2 = m2.abs, p2 = m2.pre, absIsA = true, nsets = Math.ceil(S.bestOf / 2), sets2 = [];
        for (var q2 = 0; q2 < nsets; q2++) sets2.push([0, 25]);   // a = no presentado, b = presente
        G.results.push({id:'np' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), d:new Date().toISOString().slice(0, 10), a:a2, b:p2, sets:sets2, bo:S.bestOf, np:'a', j:'', jor:m2.jor.slice(0, 20)});
        G.results.forEach(function(x){ if (x.np) uploadResult(x, false); }); saveG(); ui.modal = null; render(); toast('No presentado registrado'); break;
      }
      case 'import': ui.modal = {type:'import'}; render(); break;
      case 'importDo': {
        var list = decodeCode($('impBox').value);
        if (!list || !list.length){ $('merr').textContent = 'No he encontrado resultados válidos en ese texto.'; break; }
        var added = 0;
        list.forEach(function(r){ if (!allResults().some(function(x){ return x.id === r.id; })){ G.results.push(r); uploadResult(r, false); added++; } });
        saveG(); ui.modal = null; render();
        toast(added ? added + (added === 1 ? ' resultado añadido' : ' resultados añadidos') : 'Esos resultados ya estaban');
        break;
      }
      case 'copyall': copyText(G.results.length ? encodeCode(G.results) : 'Sin resultados todavía'); break;
      case 'delres': ui.modal = {type:'delres', id:b.getAttribute('data-id')}; render(); break;
      case 'delresDo': {
        var did = b.getAttribute('data-id');
        if (syncBase() && !G.pin){ toast('Pon la clave de árbitro en Inicio para borrar.'); ui.modal = null; render(); break; }
        G.results = G.results.filter(function(x){ return x.id !== did; }); dropShared(did);
        if (S.matchId === did && S.phase === 'done') S.matchId = '';   // el partido borrado ya no se vuelve a sumar solo
        saveG(); save(); ui.modal = null; render(); toast('Partido borrado'); break;
      }
      case 'closeModal': ui.modal = null; render(); break;
      case 'newAsk': ui.modal = {type:'new'}; render(); break;
      case 'newDo': newMatch(); ui.modal = null; ui.view = null; closeTimeout(); commit(); window.scrollTo(0, 0); break;
      case 'closeTm': closeTimeout(); break;
    }
  });
  document.addEventListener('change', function(e){
    var sel = e.target.closest && e.target.closest('[data-add-sel]');
    if (sel && ui.modal && ui.modal.type === 'add'){ ui.modal.who = sel.value; render(); return; }
    var np = e.target.closest('[data-np]');
    if (np && ui.modal){ ui.modal[np.getAttribute('data-np')] = np.value; return; }
    var el = e.target.closest('[data-m]'); if (!el || !ui.modal) return;
    var k = el.getAttribute('data-m');
    if (k === 'type') ui.modal.typeKey = el.value; else ui.modal.who = el.value;
  });
  document.addEventListener('input', function(e){
    var el = e.target; if (!el.matches) return;
    if (el.matches('[data-note]')){ S.notes = el.value; save(); }
    if (el.matches('[data-add]') && ui.modal && ui.modal.type === 'add'){ ui.modal[el.getAttribute('data-add')] = el.value; }
    if (el.matches('[data-cfg="email"]')){ G.email = el.value.trim(); saveG(); }
    if (el.matches('[data-cfg="url"]')){ G.url = el.value.trim(); saveG(); clearTimeout(window.__urlT); window.__urlT = setTimeout(function(){ pull(); flush(); }, 1200); }
    if (el.matches('[data-note]') && S.phase === 'done' && S.matchId){ clearTimeout(window.__noteT); window.__noteT = setTimeout(function(){ syncResult(); }, 2500); }
  });

  if (window.__test) window.__test(function(){ return S; }, buildPDF);
  render();
  if (S.phase === 'done' && S.matchId) syncResult();   // asegura que un partido terminado esté en la clasificación y subido
  pull(); flush();
  window.addEventListener('online', function(){ flush(); pull(); });
  document.addEventListener('visibilitychange', function(){ if (!document.hidden){ flush(); pull(); } });
  setInterval(function(){ if (!document.hidden && (S.phase === 'home' || ui.view)) pull(); }, 60000);
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
    window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
  }
})();
</script>
</body>
</html>
