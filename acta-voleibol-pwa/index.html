<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acta de voleibol</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#15202b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Acta Voley">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --bg:#f3f4ef; --card:#ffffff; --ink:#15202b; --muted:#667280; --line:#d8dcd3; --field:#ffffff;
  --a:#1f5fbf; --a-soft:#dce8fa; --b:#d4472a; --b-soft:#fae0d9;
  --net:#15202b; --red:#c62828;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10161d; --card:#1a232d; --ink:#eef1f4; --muted:#93a0ad; --line:#2c3844; --field:#10161d;
    --a:#5b97ee; --a-soft:#1b2f4d; --b:#f07a5e; --b-soft:#4a251d; --net:#eef1f4; --red:#ef6b6b;
  }
}
:root[data-theme="dark"]{
  --bg:#10161d; --card:#1a232d; --ink:#eef1f4; --muted:#93a0ad; --line:#2c3844; --field:#10161d;
  --a:#5b97ee; --a-soft:#1b2f4d; --b:#f07a5e; --b-soft:#4a251d; --net:#eef1f4; --red:#ef6b6b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Avenir Next","Segoe UI",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:520px;margin:0 auto;padding:10px 10px 90px}
h1{font-size:1.5rem;margin:14px 4px 4px;letter-spacing:-.3px}
p.sub{margin:0 4px 14px;color:var(--muted);font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:1.1rem}
label.f{display:block;font-size:.85rem;color:var(--muted);margin:10px 0 4px}
label.f:first-child{margin-top:0}
.txt,select,textarea{width:100%;padding:11px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--field);font-size:1rem}
.txt:focus,select:focus,textarea:focus{outline:3px solid var(--ink);outline-offset:1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:10px;padding:14px 12px;font-weight:700;background:var(--ink);color:var(--bg);cursor:pointer;width:100%}
.btn.sec{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.warn{background:var(--red);color:#fff}
.btn:disabled{opacity:.35;cursor:default}
.btn+.btn{margin-top:8px}
.btn:focus-visible,.cell:focus-visible,.seg button:focus-visible,.tg:focus-visible,.pickb:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:12px 8px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-weight:700;cursor:pointer}
.seg button.on.ta{background:var(--a);border-color:var(--a);color:#fff}
.seg button.on.tb{background:var(--b);border-color:var(--b);color:#fff}
.seg button.on.neutral{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.err{color:var(--b);font-size:.9rem;margin:6px 2px;min-height:1.2em}
.hint{font-size:.85rem;color:var(--muted);margin:8px 2px}

.t0{--c:var(--a);--soft:var(--a-soft)}
.t1{--c:var(--b);--soft:var(--b-soft)}

/* partido */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 2px 10px}
.top .setno{font-weight:800;font-size:1.05rem}
.top .sets{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem;text-align:right}
.prev{font-size:.85rem;color:var(--muted);margin:0 2px 8px;font-variant-numeric:tabular-nums}
.notice{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 12px;margin-bottom:10px;font-weight:600}
.notice button{background:var(--bg);color:var(--ink);border:0;border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer;flex:none}

.teams{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.team{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;border-top:6px solid var(--c)}
.team.serving{background:var(--soft)}
.tname{font-weight:700;font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tscore{font-size:4.2rem;line-height:1;font-weight:900;font-variant-numeric:tabular-nums;margin:6px 0 8px;color:var(--c)}
.tscore.bump{animation:bump .15s}
@keyframes bump{50%{transform:scale(1.1)}}
@media (prefers-reduced-motion: reduce){.tscore.bump{animation:none}}
.court{margin-bottom:8px}
.net{height:5px;background:var(--net);border-radius:3px;margin-bottom:4px;opacity:.85}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.cell{position:relative;aspect-ratio:1;border-radius:8px;border:1.5px solid var(--line);background:var(--card);
  display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:0;min-width:0}
.cell b{font-size:1.3rem;line-height:1.05;font-weight:800;font-variant-numeric:tabular-nums}
.cell em{font-style:normal;font-size:.56rem;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.cell .pos{position:absolute;top:2px;left:4px;font-size:.58rem;font-weight:600;color:var(--muted)}
.cell .cap{position:absolute;top:2px;right:4px;font-size:.58rem;font-weight:800;color:var(--muted)}
.cell .ball{position:absolute;bottom:0;right:2px;font-size:.8rem}
.cell.srv{border-color:var(--c);border-width:3px}
.cell.lib{border-style:dashed;border-color:var(--ink)}
.cell.gone{border-color:var(--red);border-width:3px;opacity:.6}
.cell:disabled{cursor:default}
.cell.lusel{border-color:var(--c);border-width:3px;background:var(--soft)}
.pickb.used{opacity:.28;cursor:default}
.pt{background:var(--c);color:#fff;font-size:1.1rem;padding:16px 8px}
.tm{margin-top:6px;font-size:.85rem;padding:10px 6px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);z-index:20}
.bar .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.bar .btn{padding:12px 2px;font-size:.82rem}
.bar .btn+.btn{margin-top:0}

/* plantillas */
.rrow{display:grid;grid-template-columns:52px 1fr 36px 36px 30px;gap:6px;margin-bottom:6px;align-items:center}
.rrow .txt{padding:9px 8px}
.rn{text-align:center;font-weight:700}
.tg{height:38px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);font-weight:800;cursor:pointer}
.tg.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tg.xx{border:0;background:transparent;color:var(--muted);font-size:1.3rem}
.thd{font-weight:800;color:var(--c);margin:0 0 8px;font-size:1.05rem}
.card.tc{border-top:6px solid var(--c)}
.legend2{font-size:.8rem;color:var(--muted);margin:0 0 8px}

/* alineaciones */
.lu{padding:10px}
.lsel{display:block;position:relative}
.lsel span{position:absolute;top:2px;left:5px;font-size:.58rem;font-weight:600;color:var(--muted);pointer-events:none;z-index:1}
.lsel select{padding:14px 2px 6px 4px;font-size:.8rem;border-radius:8px}

.big{font-size:2.6rem;font-weight:900;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
.win{font-weight:800}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 4px}
.sheet .sub0{margin:0 0 10px;color:var(--muted)}
.sec-t{font-weight:700;margin:12px 0 6px}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pickb{border:1.5px solid var(--line);background:var(--field);border-radius:10px;padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;min-width:0}
.pickb b{font-size:1.4rem;line-height:1}
.pickb em{font-style:normal;font-size:.72rem;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.log{list-style:none;margin:0;padding:0}
.log li{padding:7px 0;border-bottom:1px solid var(--line);font-size:.9rem;display:flex;gap:8px}
.log li b{min-width:54px;flex:none;font-variant-numeric:tabular-nums}
.log li.sh{font-weight:800;border:0;padding-top:12px}
textarea{min-height:90px;resize:vertical}
.tmbox{position:fixed;left:10px;right:10px;top:calc(8px + env(safe-area-inset-top,0px));max-width:500px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;z-index:60}
.tmbox b{font-size:2rem;font-variant-numeric:tabular-nums}
.tmbox button{background:transparent;border:1.5px solid currentColor;border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:70;max-width:90%;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>
<div id="toast" role="status"></div>

<script src="jspdf.umd.min.js"></script>
<script>
(function(){
  var KEY = 'acta-voleibol-v3';
  var ROMAN = ['I','II','III','IV','V','VI'];
  var FRONT = [3,2,1], BACK = [4,5,0];
  var SANC = {
    amon:{label:'Amonestación', m:'W'},
    pen:{label:'Penalización', pt:true, m:'P'},
    exp:{label:'Expulsión', out:true, m:'E'},
    des:{label:'Descalificación', out:true, dq:true, m:'D'},
    retA:{label:'Retraso (advertencia)', m:'W'},
    retP:{label:'Retraso (penalización)', pt:true, m:'P'}
  };
  var S, hist = [], ui = { modal:null, error:'' }, timer = null, tmLeft = 0, tmTeam = '', toastT = null;

  function emptyRoster(){ var r = []; for (var i = 0; i < 8; i++) r.push({n:'',name:'',cap:false,lib:false}); return r; }
  function fresh(keep){
    var s = {
      phase:'setup', names:['Local','Visitante'], bestOf:5,
      info:{comp:'',lugar:'',juego:'',cat:'',div:'',ar1:'',ar2:'',an:'',fecha:new Date().toLocaleDateString('es-ES')},
      roster:[emptyRoster(), emptyRoster()],
      setNo:1, setsWon:[0,0], setScores:[], score:[0,0], serving:0, first:0, swap:false, cc:false,
      lineup:[[],[]], start:[[],[]], tm:[2,2], subs:[0,0], lib:[null,null], pl:[{},{}], out:[[],[]], dq:[[],[]],
      rotc:[0,0], slots:[[],[]], pts:[],
      events:[], setStarts:[], notes:'', notice:'', winner:null
    };
    if (keep){ s.names = keep.names; s.bestOf = keep.bestOf; s.roster = keep.roster; s.info = keep.info; s.info.fecha = new Date().toLocaleDateString('es-ES'); }
    return s;
  }
  function load(){ try { var r = localStorage.getItem(KEY); if (r) return JSON.parse(r); } catch(e){} return null; }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
  S = load() || fresh();

  /* ---------- utilidades ---------- */
  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function need(){ return Math.ceil(S.bestOf / 2); }
  function target(){ return S.setNo === S.bestOf ? 15 : 25; }
  function order(){ return S.swap ? [1,0] : [0,1]; }
  function push(){ hist.push(JSON.stringify(S)); if (hist.length > 300) hist.shift(); }
  function commit(){ save(); render(); }
  function hhmm(){ var d = new Date(); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
  function toast(msg){ var el = $('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function(){ el.classList.remove('show'); }, 3200); }
  function pname(t, n){ var r = S.roster[t].filter(function(p){ return p.n === n; })[0]; return r ? r.name : ''; }
  function label(t, n){ var nm = pname(t, n); return '#' + n + (nm ? ' ' + nm : ''); }
  function ev(t, k, x, dd){ S.events.push({s:S.setNo, a:S.score[0], b:S.score[1], t:t, k:k, x:x, d:dd || null}); }

  /* ---------- lógica del partido ---------- */
  function exitLibero(t, why){
    var L = S.lib[t]; if (!L) return;
    var idx = S.lineup[t].indexOf(L.num);
    if (idx > -1) S.lineup[t][idx] = L.rep;
    S.lib[t] = null;
    ev(t, 'lib', S.names[t] + ': sale líbero #' + L.num + ', vuelve ' + label(t, L.rep) + (why ? ' (' + why + ')' : ''));
  }
  function scorePoint(t){
    S.score[t]++;
    if (S.serving !== t){
      S.serving = t;
      S.lineup[t].push(S.lineup[t].shift());
      S.rotc[t]++;
      if (S.lib[t]){
        var idx = S.lineup[t].indexOf(S.lib[t].num);
        if (idx >= 1 && idx <= 3) exitLibero(t, 'rotación a zona de red');
      }
    }
    S.pts.push({s:S.setNo, t:t, v:S.score[t], slot:S.rotc[t] % 6, round:Math.floor(S.rotc[t] / 6)});
    var a = S.score[t], b = S.score[1 - t];
    if (a >= target() && a - b >= 2){
      S.setScores.push([S.score[0], S.score[1]]);
      S.setsWon[t]++;
      var ss = S.setStarts[S.setStarts.length - 1]; if (ss) ss.t1 = hhmm();
      ev(t, 'fin', 'Fin del set ' + S.setNo + ': ' + S.score[0] + '-' + S.score[1] + ' para ' + S.names[t]);
      if (S.setsWon[t] >= need()){ S.phase = 'done'; S.winner = t; }
      else S.phase = 'setend';
    } else if (S.setNo === S.bestOf && !S.cc && Math.max(S.score[0], S.score[1]) >= 8){
      S.cc = true; S.swap = !S.swap;
      ev(null, 'cc', 'Cambio de campo (8 puntos en el set decisivo)');
      S.notice = 'Cambio de campo: los equipos intercambian lados.';
    }
  }
  function point(t){
    if (S.phase !== 'play') return;
    push(); scorePoint(t); commit();
    var el = document.querySelector('.team.t' + t + ' .tscore');
    if (el) el.classList.add('bump');
  }
  function undo(){ if (!hist.length) return; S = JSON.parse(hist.pop()); commit(); }
  function nextSet(){
    push();
    S.setNo++; S.score = [0,0]; S.tm = [2,2]; S.subs = [0,0]; S.lib = [null,null]; S.out = [[],[]];
    S.first = 1 - S.first; S.swap = !S.swap; S.cc = false; S.notice = '';
    ev(null, 'cc', 'Cambio de campo entre sets');
    S.phase = 'lineup'; ui.error = ''; ui.luSel = null;
    commit();
  }
  function syncLineup(){
    for (var t = 0; t < 2; t++) for (var i = 0; i < 6; i++){
      var el = $('lu' + t + '_' + i);
      if (el){ if (!S.start[t]) S.start[t] = []; S.start[t][i] = el.value; }
    }
  }
  function startSet(){
    syncLineup();
    var err = '', lu = [[],[]];
    for (var t = 0; t < 2 && !err; t++){
      var seen = {};
      for (var i = 0; i < 6; i++){
        var v = S.start[t][i];
        if (!v){ err = 'Faltan jugadores en la alineación de ' + S.names[t] + '.'; break; }
        if (seen[v]){ err = 'Jugador repetido en ' + S.names[t] + ': ' + v + '.'; break; }
        if (S.dq[t].indexOf(v) > -1){ err = 'El ' + v + ' de ' + S.names[t] + ' está descalificado.'; break; }
        seen[v] = 1; lu[t].push(v);
      }
    }
    if (err){ ui.error = err; $('err').textContent = err; return; }
    push();
    S.lineup = lu; S.start = [lu[0].slice(), lu[1].slice()];
    S.slots = [lu[0].slice(), lu[1].slice()]; S.rotc = [0,0];
    S.serving = S.first; S.cc = false;
    S.pl = [{},{}];
    for (var tt = 0; tt < 2; tt++) lu[tt].forEach(function(n){ S.pl[tt][n] = {st:'start'}; });
    S.setStarts.push({n:S.setNo, first:S.first, start:[lu[0].slice(), lu[1].slice()], swap:S.swap, t0:hhmm(), t1:''});
    S.phase = 'play'; ui.error = '';
    commit();
  }
  function startTimeout(t){
    if (S.phase !== 'play' || S.tm[t] <= 0) return;
    push(); S.tm[t]--;
    ev(t, 'tm', 'Tiempo muerto de ' + S.names[t]);
    save();
    tmTeam = S.names[t]; tmLeft = 30;
    clearInterval(timer);
    timer = setInterval(function(){ tmLeft--; if (tmLeft <= 0) closeTimeout(); else renderTimer(); }, 1000);
    render(); renderTimer();
  }
  function closeTimeout(){ clearInterval(timer); timer = null; tmLeft = 0; renderTimer(); }
  function renderTimer(){
    var box = $('layer'), cur = box.querySelector('.tmbox');
    if (!timer){ if (cur) cur.remove(); return; }
    var html = '<div class="tmbox" role="timer"><span>Tiempo muerto: ' + esc(tmTeam) + '</span><b>' + tmLeft + '</b><button data-a="closeTm">Cerrar</button></div>';
    if (cur) cur.outerHTML = html; else box.insertAdjacentHTML('afterbegin', html);
  }

  function benchFor(t, c){
    var on = {}; S.lineup[t].forEach(function(n){ on[n] = 1; });
    if (S.lib[t]) on[S.lib[t].rep] = 1;
    var st = S.pl[t][c];
    return S.roster[t].filter(function(p){
      if (p.lib || on[p.n] || !st) return false;
      if (S.out[t].indexOf(p.n) > -1 || S.dq[t].indexOf(p.n) > -1) return false;
      if (st.st === 'start') return !S.pl[t][p.n];
      if (st.st === 'sub') return p.n === st.p && S.pl[t][p.n] && S.pl[t][p.n].st === 'out';
      return false;
    });
  }
  function doEnter(p){
    var m = ui.modal, t = m.t, i = m.i, c = S.lineup[t][i];
    if (S.subs[t] >= 6) return;
    push();
    var st = S.pl[t][c];
    if (st.st === 'start'){ S.pl[t][c] = {st:'out', p:p}; S.pl[t][p] = {st:'sub', p:c}; }
    else { S.pl[t][c] = {st:'closed'}; S.pl[t][p] = {st:'closed'}; }
    var slot = S.slots[t].indexOf(c);
    if (slot > -1) S.slots[t][slot] = p;
    S.lineup[t][i] = p; S.subs[t]++;
    ev(t, 'sub', 'Cambio ' + S.names[t] + ' (' + S.subs[t] + '): sale ' + label(t, c) + ', entra ' + label(t, p), {slot:slot, out:c, inn:p});
    ui.modal = null; commit();
  }
  function doLibIn(num){
    var m = ui.modal, t = m.t, i = m.i;
    if (S.lib[t]) return;
    push();
    var rep = S.lineup[t][i];
    S.lineup[t][i] = num; S.lib[t] = {num:num, rep:rep};
    ev(t, 'lib', S.names[t] + ': entra líbero #' + num + ' por ' + label(t, rep));
    ui.modal = null; commit();
  }
  function doLibOut(){
    var t = ui.modal.t;
    push(); exitLibero(t, ''); ui.modal = null; commit();
  }
  function applySanc(){
    var m = ui.modal;
    if (!m.who){ $('merr').textContent = 'Elige a quién se sanciona.'; return; }
    var key = m.typeKey || 'amon', T = SANC[key], t = m.t, opp = 1 - t, who = m.who, name;
    push();
    if (who === 'ENT') name = 'el entrenador';
    else if (who === 'AUX') name = 'el auxiliar';
    else name = label(t, who);
    ev(t, 'san', T.label + ' a ' + name + ' de ' + S.names[t] + (T.pt ? ' (punto y saque para ' + S.names[opp] + ')' : ''), {tk:key, who:who});
    if (T.out && who !== 'ENT' && who !== 'AUX'){
      if (T.dq) S.dq[t].push(who); else S.out[t].push(who);
      if (S.lineup[t].indexOf(who) > -1) S.notice = 'El ' + who + ' de ' + S.names[t] + ' debe ser sustituido.';
    }
    if (T.pt && S.phase === 'play') scorePoint(opp);
    ui.modal = null; commit();
  }

  /* ---------- plantillas ---------- */
  function syncSetup(){
    if (!$('n0')) return;
    S.names = [$('n0').value.trim() || 'Local', $('n1').value.trim() || 'Visitante'];
    ['comp','lugar','juego','cat','ar1','ar2','an'].forEach(function(k){ S.info[k] = $('i_' + k).value.trim(); });
  }
  function syncRoster(){
    document.querySelectorAll('[data-r]').forEach(function(el){
      var t = +el.getAttribute('data-t'), i = +el.getAttribute('data-i'), k = el.getAttribute('data-r');
      if (S.roster[t][i]) S.roster[t][i][k] = el.value.trim();
    });
  }
  function validateRoster(){
    for (var t = 0; t < 2; t++){
      var rows = S.roster[t].filter(function(p){ return p.n !== '' || p.name !== ''; });
      var seen = {}, libs = 0, players = 0;
      for (var i = 0; i < rows.length; i++){
        var p = rows[i];
        if (p.n === '') return 'Falta el número de ' + p.name + ' en ' + S.names[t] + '.';
        if (!/^\d{1,2}$/.test(p.n)) return 'Número no válido en ' + S.names[t] + ': ' + p.n + '.';
        p.n = String(parseInt(p.n, 10));
        if (seen[p.n]) return 'Número repetido en ' + S.names[t] + ': ' + p.n + '.';
        seen[p.n] = 1;
        if (p.lib) libs++; else players++;
      }
      if (libs > 2) return S.names[t] + ' tiene más de 2 líberos.';
      if (players < 6) return S.names[t] + ' necesita al menos 6 jugadores (sin contar líberos).';
      rows.sort(function(x, y){ return (+x.n) - (+y.n); });
      S.roster[t] = rows;
    }
    return '';
  }

      '<div class="row2"><div><label class="f" for="i_ar1">1.er árbitro</label><input class="txt" id="i_ar1" value="' + esc(S.info.ar1) + '"></div>' +
      '<div><label class="f" for="i_ar2">2.º árbitro</label><input class="txt" id="i_ar2" value="' + esc(S.info.ar2) + '"></div></div>' +
      '<label class="f" for="i_an">Anotador</label><input class="txt" id="i_an" value="' + esc(S.info.an) + '"></div>' +

    var h = '<h1>Plantillas</h1><p class="sub">Número y nombre de cada jugador.</p>';

  function getStart(t, i){ return S.start && S.start[t] && S.start[t][i] ? S.start[t][i] : ''; }
  function luAutoNext(t, i){
    var all = FRONT.concat(BACK), ci = all.indexOf(i);
    for (var k = 1; k <= 6; k++){ var ni = all[(ci + k) % 6]; if (!getStart(t, ni)) return {t:t, i:ni}; }
    var ot = 1 - t;
    for (var k2 = 0; k2 < 6; k2++){ var ni2 = all[k2]; if (!getStart(ot, ni2)) return {t:ot, i:ni2}; }
    return null;
  }
  function lineupCellHTML(t, i){
    var n = getStart(t, i), nm = n ? pname(t, n) : '';
    var isSel = ui.luSel && ui.luSel.t === t && ui.luSel.i === i;
    return '<button class="cell' + (isSel ? ' lusel' : '') + '" data-a="lupick" data-t="' + t + '" data-i="' + i + '" aria-label="Posición ' + ROMAN[i] + (n ? ', jugador ' + n : ', vacía') + '">' +
      '<span class="pos">' + ROMAN[i] + '</span>' +
      (n ? '<b>' + esc(n) + '</b><em>' + esc(nm) + '</em>' : '<b style="opacity:.22">—</b>') + '</button>';
  }
  function playerPickerHTML(){
    var s = ui.luSel; if (!s) return '';
    var t = s.t, assigned = {};
    if (S.start[t]) S.start[t].forEach(function(n){ if (n) assigned[n] = 1; });
    var players = S.roster[t].filter(function(p){ return !p.lib; });
    var h = '<p style="margin:0 0 8px;font-size:.88rem;color:var(--muted)">Elige jugador para posición <b>' + ROMAN[s.i] + '</b> de ' + esc(S.names[t]) + ':</p><div class="pick">';
    players.forEach(function(p){
      var here = getStart(t, s.i) === p.n, used = assigned[p.n] && !here;
      h += '<button class="pickb' + (used ? ' used' : '') + '" data-a="luassign" data-t="' + t + '" data-n="' + esc(p.n) + '"' + (used ? ' disabled' : '') + '><b>' + esc(p.n) + '</b><em>' + esc(p.name || '') + '</em></button>';
    });
    return h + '</div>';
  }
  function syncLineup(){ /* no-op: S.start[] se actualiza al momento */ }

  function cellHTML(t, i, live){
    var n = S.lineup[t][i], L = S.lib[t], isLib = L && L.num === n;
    var srv = (i === 0 && S.serving === t && live);
    var gone = S.out[t].indexOf(n) > -1 || S.dq[t].indexOf(n) > -1;
    var cap = S.roster[t].filter(function(p){ return p.n === n && p.cap; }).length;
    var nm = pname(t, n);
    return '<button class="cell' + (srv ? ' srv' : '') + (isLib ? ' lib' : '') + (gone ? ' gone' : '') + '" ' +
      (live ? 'data-a="cell" data-t="' + t + '" data-i="' + i + '"' : 'disabled') +
      ' aria-label="Posición ' + ROMAN[i] + ', número ' + esc(n) + (nm ? ' ' + esc(nm) : '') + (isLib ? ', líbero' : '') + (srv ? ', al saque' : '') + '">' +
      '<span class="pos">' + ROMAN[i] + '</span>' + (cap ? '<span class="cap">C</span>' : '') +
      '<b>' + esc(n) + '</b><em>' + (isLib ? 'Líbero' : esc(nm)) + '</em>' + (srv ? '<span class="ball">🏐</span>' : '') + '</button>';
  }
  function courtHTML(t, live){
    return '<div class="court"><div class="net"></div><div class="grid">' +
      FRONT.map(function(i){ return cellHTML(t, i, live); }).join('') + '</div></div><div class="grid" style="margin-bottom:8px">' +
      BACK.map(function(i){ return cellHTML(t, i, live); }).join('') + '</div>';
  }

  function viewPlay(){
    var live = S.phase === 'play', o = order();
    var prev = S.setScores.length ? S.setScores.map(function(s){ return s[0] + '-' + s[1]; }).join(' · ') : '';
    var h = '<div class="top"><div class="setno">Set ' + S.setNo + ' <span style="font-weight:500;color:var(--muted)">a ' + target() + '</span></div>' +
      '<div class="sets">Sets: ' + S.setsWon[o[0]] + ' – ' + S.setsWon[o[1]] + '</div></div>' +
      (prev ? '<div class="prev">Sets anteriores (A-B): ' + esc(prev) + '</div>' : '');
    if (S.notice) h += '<div class="notice" role="status"><span>' + esc(S.notice) + '</span><button data-a="dismiss">Entendido</button></div>';
    h += '<div class="teams">';
    o.forEach(function(t){
      h += '<section class="team t' + t + (S.serving === t && live ? ' serving' : '') + '">' +
        '<div class="tname">' + esc(S.names[t]) + '</div>' +
        '<div class="tscore" aria-live="polite">' + S.score[t] + '</div>' + courtHTML(t, live) +
        '<button class="btn pt" data-a="pt" data-t="' + t + '"' + (live ? '' : ' disabled') + '>+1 punto</button>' +
        '<button class="btn sec tm" data-a="tm" data-t="' + t + '"' + (live && S.tm[t] > 0 ? '' : ' disabled') + '>Tiempo muerto (' + S.tm[t] + ')</button></section>';
    });
    h += '</div><p class="hint">Toca un jugador para hacer un cambio o meter al líbero. Cambios en este set: ' +

    if (S.phase === 'setend'){
      var last = S.setScores[S.setScores.length - 1], w = last[0] > last[1] ? 0 : 1;
      h += '<div class="card"><div style="text-align:center;color:var(--muted)">Set ' + S.setNo + ' para ' + esc(S.names[w]) + '</div>' +
        '<div class="big">' + last[0] + ' – ' + last[1] + '</div><button class="btn" data-a="next">Siguiente set</button></div>';

  function barHTML(){
    return '<nav class="bar"><div class="in">' +
      '<button class="btn sec" data-a="undo"' + (hist.length ? '' : ' disabled') + '>Deshacer</button>' +
      '<button class="btn sec" data-a="sanc"' + (S.phase === 'play' ? '' : ' disabled') + '>Sanción</button>' +
      '<button class="btn sec" data-a="swap"' + (S.phase === 'play' ? '' : ' disabled') + '>Lados</button>' +
      '<button class="btn sec" data-a="log">Registro</button><button class="btn sec" data-a="pdf">PDF</button></div></nav>';

    S.setScores.forEach(function(s, i){
      h += '<tr><td>' + (i + 1) + '</td><td' + (s[0] > s[1] ? ' class="win"' : '') + '>' + s[0] + '</td><td' + (s[1] > s[0] ? ' class="win"' : '') + '>' + s[1] + '</td></tr>';
    });
    return h + '</table>';
  }
  function viewDone(){
    return '<h1>Fin del partido</h1><p class="sub">Gana ' + esc(S.names[S.winner]) + '.</p>' +
      '<div class="card"><div class="big">' + S.setsWon[0] + ' – ' + S.setsWon[1] + '</div>' + setsTable() + '</div>' +
      '<div class="card"><h2>Observaciones</h2><textarea data-note="1" placeholder="Incidencias, reclamaciones, comentarios del árbitro...">' + esc(S.notes) + '</textarea></div>' +

      '<button class="btn sec" data-a="undo">Deshacer último punto</button>' +
      '<button class="btn sec" data-a="newAsk">Nuevo partido</button>';

  /* ---------- modales ---------- */
  function cellModal(){
    var m = ui.modal, t = m.t, i = m.i, num = S.lineup[t][i], L = S.lib[t];
    var isLib = L && L.num === num;
    var h = '<h3>' + esc(S.names[t]) + ' · posición ' + ROMAN[i] + '</h3><p class="sub0">' + esc(label(t, num)) + (isLib ? ' (líbero)' : '') + '</p>';
    if (isLib){
      h += '<button class="btn" data-a="libout">Sale el líbero (vuelve ' + esc(label(t, L.rep)) + ')</button>';
    } else {
      h += '<div class="sec-t">Cambio de jugador (' + S.subs[t] + '/6)</div>';
      var c = benchFor(t, num);
      if (S.subs[t] >= 6) h += '<p class="hint">Ya se hicieron los 6 cambios de este set.</p>';
      else if (!c.length) h += '<p class="hint">No hay jugadores que puedan entrar en este puesto.</p>';
      else h += '<div class="pick">' + c.map(function(p){ return '<button class="pickb" data-a="enter" data-p="' + esc(p.n) + '"><b>' + esc(p.n) + '</b><em>' + esc(p.name || 'Sin nombre') + '</em></button>'; }).join('') + '</div>';
      h += '<div class="sec-t">Líbero</div>';
      if (!(i === 0 || i === 4 || i === 5)) h += '<p class="hint">El líbero solo sustituye a jugadores de zaga.</p>';
      else if (L) h += '<p class="hint">El líbero ya está en pista. Toca su casilla para que salga.</p>';
      else {
        var libs = S.roster[t].filter(function(p){ return p.lib; });
        if (!libs.length) h += '<p class="hint">Este equipo no tiene líbero en la plantilla.</p>';
        else h += '<div class="pick">' + libs.map(function(p){ return '<button class="pickb" data-a="libin" data-p="' + esc(p.n) + '"><b>' + esc(p.n) + '</b><em>' + esc(p.name || 'Líbero') + '</em></button>'; }).join('') + '</div>';
      }
    }
    return h + '<button class="btn sec" style="margin-top:14px" data-a="closeModal">Cerrar</button>';
  }
  function sancModal(){
    var m = ui.modal, t = m.t;

      '<button data-a="sancTeam" data-t="1" class="tb' + (t === 1 ? ' on' : '') + '">' + esc(S.names[1]) + '</button></div>' +
      '<label class="f" for="sType">Tipo</label><select id="sType" data-m="type">';
    Object.keys(SANC).forEach(function(k){ h += '<option value="' + k + '"' + (m.typeKey === k ? ' selected' : '') + '>' + SANC[k].label + (SANC[k].pt ? ' (punto al rival)' : '') + '</option>'; });
    h += '</select><label class="f" for="sWho">Sancionado</label><select id="sWho" data-m="who"><option value="">—</option>' +
      '<option value="ENT"' + (m.who === 'ENT' ? ' selected' : '') + '>Entrenador</option><option value="AUX"' + (m.who === 'AUX' ? ' selected' : '') + '>Auxiliar</option>';

    h += '</select><div class="err" id="merr" role="alert"></div>' +
      '<button class="btn" data-a="applySanc">Anotar sanción</button><button class="btn sec" data-a="closeModal">Cancelar</button>';

  function logModal(){
    var h = '<h3>Registro del partido</h3><p class="sub0">' + esc(S.names[0]) + ' ' + S.setsWon[0] + ' – ' + S.setsWon[1] + ' ' + esc(S.names[1]) + '</p>';

    h += '<ul class="log">';
    var cur = 0;
    if (!S.events.length) h += '<li>Todavía no hay cambios, tiempos muertos ni sanciones.</li>';

      if (e.s !== cur){ cur = e.s; h += '<li class="sh">Set ' + cur + '</li>'; }

  function modalHTML(){
    var m = ui.modal; if (!m) return '';
    var body = '';
    if (m.type === 'cell') body = cellModal();
    else if (m.type === 'sanc') body = sancModal();
    else if (m.type === 'log') body = logModal();
    else if (m.type === 'new') body = '<h3>¿Empezar un partido nuevo?</h3><p class="sub0">Se borra el partido actual. Se conservan los equipos y las plantillas.</p>' +
      '<button class="btn warn" data-a="newDo">Borrar y empezar</button><button class="btn sec" data-a="closeModal">Cancelar</button>';

  function render(){
    var app = $('app'), scroll = window.scrollY;
    app.innerHTML = S.phase === 'setup' ? viewSetup() : S.phase === 'roster' ? viewRoster() : S.phase === 'lineup' ? viewLineup() : S.phase === 'done' ? viewDone() : viewPlay();
    var layer = $('layer'), tb = layer.querySelector('.tmbox');
    layer.innerHTML = (tb ? tb.outerHTML : '') + modalHTML();
    window.scrollTo(0, scroll);
  }

  /* ---------- resumen en texto ---------- */
  function summaryText(){
    var L = [];
    L.push('ACTA DE VOLEIBOL');
    if (S.info.comp) L.push('Competición: ' + S.info.comp);
    if (S.info.lugar) L.push('Lugar: ' + S.info.lugar);
    L.push('Fecha: ' + S.info.fecha);
    if (S.info.ar1 || S.info.ar2) L.push('Árbitros: ' + [S.info.ar1, S.info.ar2].filter(Boolean).join(' / '));
    L.push('');
    L.push(S.names[0] + ' ' + S.setsWon[0] + ' - ' + S.setsWon[1] + ' ' + S.names[1]);
    S.setScores.forEach(function(s, i){ L.push('Set ' + (i + 1) + ': ' + s[0] + '-' + s[1]); });
    L.push('');
    S.events.forEach(function(e){ L.push('Set ' + e.s + ' (' + e.a + '-' + e.b + '): ' + e.x); });
    if (S.notes){ L.push(''); L.push('Observaciones: ' + S.notes); }
    return L.join('\n');
  }
  function slug(s){ return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '').toLowerCase(); }

  /* ---------- PDF con formato de acta ---------- */
  function mins(a, b){

  document.addEventListener('click', function(e){
    var b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
    var a = b.getAttribute('data-a'), t = parseInt(b.getAttribute('data-t'), 10), i = parseInt(b.getAttribute('data-i'), 10);
    switch (a){
      case 'pt': point(t); break;
      case 'tm': startTimeout(t); break;
      case 'undo': undo(); break;
      case 'next': nextSet(); break;
      case 'dismiss': S.notice = ''; save(); render(); break;
      case 'bo': syncSetup(); S.bestOf = parseInt(b.getAttribute('data-v'), 10); save(); render(); break;
      case 'div': syncSetup(); S.info.div = b.getAttribute('data-v'); save(); render(); break;
      case 'toRoster': syncSetup(); S.phase = 'roster'; ui.error = ''; commit(); window.scrollTo(0, 0); break;
      case 'toSetup': syncRoster(); S.phase = 'setup'; commit(); break;
      case 'radd': syncRoster(); if (S.roster[t].length < 14) S.roster[t].push({n:'',name:'',cap:false,lib:false}); commit(); break;
      case 'rdel': syncRoster(); S.roster[t].splice(i, 1); commit(); break;
      case 'rcap': syncRoster(); var was = S.roster[t][i].cap; S.roster[t].forEach(function(p){ p.cap = false; }); S.roster[t][i].cap = !was; commit(); break;
      case 'rlib':
        syncRoster();
        if (!S.roster[t][i].lib && S.roster[t].filter(function(p){ return p.lib; }).length >= 2){ toast('Un equipo puede tener como máximo 2 líberos.'); break; }
        S.roster[t][i].lib = !S.roster[t][i].lib; commit(); break;
      case 'toLineup':
        syncRoster(); var er = validateRoster();
        if (er){ ui.error = er; render(); window.scrollTo(0, document.body.scrollHeight); break; }
        S.phase = 'lineup'; ui.error = ''; ui.luSel = null; commit(); window.scrollTo(0, 0); break;
      case 'editRoster': S.phase = 'roster'; ui.error = ''; commit(); break;
      case 'lupick':
        ui.luSel = {t:t, i:i};
        save(); render();
        setTimeout(function(){ var p = document.getElementById('lupicker'); if (p) p.scrollIntoView({behavior:'smooth', block:'nearest'}); }, 60);
        break;
      case 'luassign': {
        var nn = b.getAttribute('data-n'), si = ui.luSel ? ui.luSel.i : FRONT[0];
        if (!S.start[t]) S.start[t] = [];
        // Si el jugador ya estaba en otra posición, liberarla
        for (var kk = 0; kk < 6; kk++){ if (S.start[t][kk] === nn) S.start[t][kk] = ''; }
        S.start[t][si] = nn;
        ui.luSel = luAutoNext(t, si);
        save(); render();
        setTimeout(function(){ var p = document.getElementById('lupicker'); if (p) p.scrollIntoView({behavior:'smooth', block:'nearest'}); }, 60);
        break;
      }
      case 'first':
        S.first = parseInt(b.getAttribute('data-v'), 10);
        document.querySelectorAll('[data-a="first"]').forEach(function(x){ x.classList.toggle('on', x === b); });
        save(); break;
      case 'side': syncLineup(); S.swap = !S.swap; commit(); break;
      case 'startSet': startSet(); break;
      case 'cell': ui.modal = {type:'cell', t:t, i:i}; render(); break;
      case 'enter': doEnter(b.getAttribute('data-p')); break;
      case 'libin': doLibIn(b.getAttribute('data-p')); break;
      case 'libout': doLibOut(); break;
      case 'sanc': ui.modal = {type:'sanc', t:0, typeKey:'amon', who:''}; render(); break;
      case 'sancTeam': ui.modal.t = t; ui.modal.who = ''; render(); break;
      case 'applySanc': applySanc(); break;
      case 'swap': push(); S.swap = !S.swap; ev(null, 'cc', 'Cambio de campo manual'); commit(); break;
      case 'log': ui.modal = {type:'log'}; render(); break;
      case 'pdf': exportPDF(); break;
      case 'closeModal': ui.modal = null; render(); break;
      case 'newAsk': ui.modal = {type:'new'}; render(); break;
      case 'newDo': S = fresh({names:S.names, bestOf:S.bestOf, roster:S.roster, info:S.info}); S.phase = 'roster'; hist = []; ui.modal = null; closeTimeout(); commit(); window.scrollTo(0, 0); break;
      case 'closeTm': closeTimeout(); break;
    }
  });
  document.addEventListener('change', function(e){
    var el = e.target.closest('[data-m]'); if (!el || !ui.modal) return;
    var k = el.getAttribute('data-m');
    if (k === 'type') ui.modal.typeKey = el.value; else ui.modal.who = el.value;
  });
  document.addEventListener('input', function(e){
    if (e.target.matches && e.target.matches('[data-note]')){ S.notes = e.target.value; save(); }
  });

  if (window.__test) window.__test(function(){ return S; }, buildPDF);
  render();
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
    window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
  }
})();
</script>
</body>
</html>
